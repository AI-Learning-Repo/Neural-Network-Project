<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 505" role="img" aria-labelledby="title desc">
<title id="title">Five incremental phases</title><desc id="desc">Five incremental phases</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="920" height="505" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="460.0" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Five incremental phases</text>
<path d="M460.0 112 L460.0 136" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M460.0 194 L460.0 218" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M460.0 276 L460.0 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M460.0 358 L460.0 382" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="190" y="54" width="540" height="58" rx="10" fill="white" stroke="#475569" stroke-width="2"/>
<text x="460.0" y="78.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">1 · Static response</text>
<text x="460.0" y="99.0" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">No LLM</text>
<rect x="190" y="136" width="540" height="58" rx="10" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="460.0" y="160.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f766e">2 · Deterministic business rules</text>
<text x="460.0" y="181.0" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Menu and exact totals</text>
<rect x="190" y="218" width="540" height="58" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
<text x="460.0" y="242.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#7c3aed">3 · Intelligent server</text>
<text x="460.0" y="263.0" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Model selects tools</text>
<rect x="190" y="300" width="540" height="58" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="324.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#2563eb">4 · Intelligent client</text>
<text x="460.0" y="345.0" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Deep Agents selects remote services</text>
<rect x="190" y="382" width="540" height="58" rx="10" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="460.0" y="406.0" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#b45309">5 · Three-agent system</text>
<text x="460.0" y="427.0" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Burger + Pizza + Dessert</text>
</svg>