<text x="400.0" y="166.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">○ Implement or adapt the Flight Booking Agent</text>
<rect x="30" y="187" width="740" height="36" rx="10" fill="#475569" fill-opacity=".075" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="210.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">○ Implement or adapt the Hotel Reservation Agent</text>
