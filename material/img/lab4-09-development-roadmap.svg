<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"><title>Implementation roadmap</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs><rect width="800" height="600" rx="16" fill="#ffffff"/><text x="400.0" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#172554" font-family="Arial,sans-serif">Implementation roadmap</text>
<rect x="30" y="55" width="740" height="36" rx="10" fill="#475569" fill-opacity=".075" stroke="#475569" stroke-width="1.5"/>
<text x="400.0" y="78.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#475569">○ Define travel datasets, supported destinations, dates and pricing units</text>
