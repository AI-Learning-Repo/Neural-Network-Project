<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 375" role="img" aria-labelledby="title desc">
<title id="title">Task lifecycle</title><desc id="desc">Domain validation errors may be returned in a completed task.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="920" height="375" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="460.0" y="31" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Task lifecycle</text>
<path d="M460.0 110 L460.0 145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M460.0 200 L200.0 265" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="330.0" y="226.5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155" paint-order="stroke" stroke="#f8fafc" stroke-width="5">success</text>
<path d="M460.0 200 L720.0 265" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="590.0" y="226.5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155" paint-order="stroke" stroke="#f8fafc" stroke-width="5">exception</text>
<rect x="330" y="55" width="260" height="55" rx="10" fill="white" stroke="#475569" stroke-width="2"/>
<text x="460.0" y="77.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">SUBMITTED</text>
<text x="460.0" y="98.5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Create task</text>
<rect x="330" y="145" width="260" height="55" rx="10" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="167.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#2563eb">WORKING</text>
<text x="460.0" y="188.5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Execute application</text>
<rect x="50" y="265" width="300" height="65" rx="10" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="200.0" y="292.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f766e">COMPLETED</text>
<text x="200.0" y="313.5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Publish text artifact</text>
<rect x="570" y="265" width="300" height="65" rx="10" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="720.0" y="292.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#b45309">FAILED</text>
<text x="720.0" y="313.5" font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#334155">Log unexpected error</text>
<text x="460.0" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">Domain validation errors may be returned in a completed task.</text>
</svg>