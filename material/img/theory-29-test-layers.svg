<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 605" role="img" aria-label="Testing an agentic system"><rect width="960" height="605" rx="18" fill="#f8fafc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><g font-family="Arial, sans-serif"><text x="480" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Testing an agentic system</text><rect x="75" y="58" width="810" height="78" rx="12" fill="white" stroke="#1d4ed8" stroke-width="2"/><text x="480" y="87" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">Unit tests</text><text x="480" y="113" text-anchor="middle" font-size="16" fill="#334155">Validate deterministic menu, currency and budget rules</text><path d="M480 136 V160" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="75" y="163" width="810" height="78" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><text x="480" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#0f766e">Service smoke tests</text><text x="480" y="218" text-anchor="middle" font-size="16" fill="#334155">Check process, card, request and artifact</text><path d="M480 241 V265" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="75" y="268" width="810" height="78" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="480" y="297" text-anchor="middle" font-size="21" font-weight="700" fill="#7c3aed">Inspector</text><text x="480" y="323" text-anchor="middle" font-size="16" fill="#334155">Interact manually and inspect protocol traffic</text><path d="M480 346 V370" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="75" y="373" width="810" height="78" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><text x="480" y="402" text-anchor="middle" font-size="21" font-weight="700" fill="#b45309">TCK and ITK</text><text x="480" y="428" text-anchor="middle" font-size="16" fill="#33