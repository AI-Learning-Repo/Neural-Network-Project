<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="Different objects, different purposes"><rect width="960" height="500" rx="18" fill="#f8fafc"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs><g font-family="Arial, sans-serif"><text x="480" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">Different objects, different purposes</text><rect x="75" y="58" width="810" height="78" rx="12" fill="white" stroke="#1d4ed8" stroke-width="2"/><text x="480" y="87" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">Message</text><text x="480" y="113" text-anchor="middle" font-size="16" fill="#334155">One communication turn; ID, role and parts</text><path d="M480 136 V160" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="75" y="163" width="810" height="78" rx="12" fill="white" stroke="#0f766e" stroke-width="2"/><text x="480" y="192" text-anchor="middle" font-size="21" font-weight="700" fill="#0f766e">Task</text><text x="480" y="218" text-anchor="middle" font-size="16" fill="#334155">A tracked unit of work; ID, context and status</text><path d="M480 241 V265" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="75" y="268" width="810" height="78" rx="12" fill="white" stroke="#7c3aed" stroke-width="2"/><text x="480" y="297" text-anchor="middle" font-size="21" font-weight="700" fill="#7c3aed">Artifact</text><text x="480" y="323" text-anchor="middle" font-size="16" fill="#334155">A result of the task; ID, name and parts</text><path d="M480 346 V370" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="75" y="373" width="810" height="78" rx="12" fill="white" stroke="#b45309" stroke-width="2"/><text x="480" y="402" text-anchor="middle" font-size="21" font-weight="700" fill="#b45309">Context</text><text x="480" y="428" text-anchor="middle" font-size="16" fill="#334155">Groups related tasks and messages; not a global session</text></g></svg>